<!DOCTYPE html>
<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Le Fran&ccedil;ais pour mon amour Halima &#10084;&#65039;</title>
<style>

:root{
  --rose:#ff5c8a; --rose2:#ff8fb1; --violet:#7c5cff; --bleu:#3ecfff; --vert:#22c98a;
  --or:#ffc75f; --sombre:#1b1230; --sombre2:#2a1b4d; --clair:#fff7fb; --gris:#6b6480;
  --ombre:0 12px 34px rgba(60,20,80,.18);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  background:linear-gradient(160deg,#fff0f6 0%,#f3f0ff 45%,#eafaff 100%);
  color:var(--sombre); min-height:100vh; overflow-x:hidden; position:relative;
}
/* ---------- décor animé ---------- */
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.45;z-index:0;animation:flotte 18s ease-in-out infinite}
.b1{width:420px;height:420px;background:#ffb3cd;top:-120px;left:-100px}
.b2{width:380px;height:380px;background:#c3b6ff;bottom:-140px;right:-80px;animation-delay:-6s}
.b3{width:300px;height:300px;background:#9be8ff;top:40%;right:20%;animation-delay:-11s}
@keyframes flotte{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(40px,-30px) scale(1.08)}66%{transform:translate(-30px,25px) scale(.95)}}
.coeurs{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.coeur{position:absolute;font-size:18px;opacity:.35;animation:monte linear infinite}
@keyframes monte{0%{transform:translateY(105vh) rotate(0);opacity:0}10%{opacity:.4}100%{transform:translateY(-12vh) rotate(360deg);opacity:0}}

.wrap{position:relative;z-index:2;max-width:1080px;margin:0 auto;padding:0 16px 120px}

/* ---------- en-tête ---------- */
header.top{
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);
  background:rgba(255,255,255,.78);border-bottom:1px solid rgba(124,92,255,.14);
}
.topin{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.05rem}
.logo .bulle{width:38px;height:38px;border-radius:14px;background:linear-gradient(135deg,var(--rose),var(--violet));display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 16px rgba(255,92,138,.4)}
.logo small{display:block;font-weight:600;font-size:.7rem;color:var(--rose);letter-spacing:.4px}
nav.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav.tabs button{
  border:0;background:transparent;padding:9px 14px;border-radius:999px;cursor:pointer;
  font-weight:700;font-size:.88rem;color:var(--gris);transition:.2s;font-family:inherit
}
nav.tabs button:hover{background:rgba(124,92,255,.1);color:var(--violet)}
nav.tabs button.on{background:linear-gradient(135deg,var(--rose),var(--violet));color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.32)}
.hud{display:flex;gap:8px;align-items:center}
.chip{display:flex;align-items:center;gap:5px;background:#fff;border:2px solid #ffe3ee;border-radius:999px;padding:5px 11px;font-weight:800;font-size:.82rem;box-shadow:0 3px 10px rgba(0,0,0,.05)}
.chip.xp{border-color:#ffe9c2}.chip.streak{border-color:#ffd9d9}
.langsel{display:flex;background:#fff;border:2px solid #eee6ff;border-radius:999px;overflow:hidden}
.langsel button{border:0;background:transparent;padding:6px 10px;font-size:.8rem;font-weight:800;cursor:pointer;color:var(--gris);font-family:inherit}
.langsel button.on{background:var(--violet);color:#fff}

/* ---------- héros ---------- */
.hero{text-align:center;padding:46px 20px 34px;position:relative}
.dedicace{
  display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,#fff,#ffeff6);
  border:2px dashed var(--rose);color:var(--rose);font-weight:800;padding:8px 18px;border-radius:999px;
  font-size:.9rem;box-shadow:var(--ombre);animation:pulse 2.6s ease-in-out infinite
}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.045)}}
.hero h1{font-size:clamp(2rem,5.5vw,3.4rem);line-height:1.08;margin:18px 0 10px;font-weight:900;
  background:linear-gradient(120deg,var(--rose),var(--violet) 55%,var(--bleu));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.sub{color:var(--gris);font-size:1.05rem;max-width:640px;margin:0 auto 22px;line-height:1.6}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{
  border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:.95rem;padding:14px 26px;border-radius:999px;
  background:linear-gradient(135deg,var(--rose),var(--violet));color:#fff;box-shadow:0 10px 24px rgba(255,92,138,.35);transition:.18s
}
.btn:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(255,92,138,.45)}
.btn.ghost{background:#fff;color:var(--violet);box-shadow:var(--ombre)}
.btn.sm{padding:9px 16px;font-size:.85rem}
.btn.vert{background:linear-gradient(135deg,#22c98a,#3ecfff);box-shadow:0 10px 24px rgba(34,201,138,.32)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}

/* ---------- cartes ---------- */
.card{background:rgba(255,255,255,.9);border-radius:var(--r);padding:22px;box-shadow:var(--ombre);border:1px solid rgba(255,255,255,.7)}
.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
h2.sec{font-size:1.6rem;margin:34px 0 6px;font-weight:900}
p.secsub{color:var(--gris);margin-bottom:18px}

.modcard{cursor:pointer;position:relative;overflow:hidden;transition:.2s;border-top:6px solid var(--rose)}
.modcard:hover{transform:translateY(-6px)}
.modcard .ico{font-size:2.4rem}
.modcard h3{margin:8px 0 4px;font-size:1.12rem}
.modcard p{color:var(--gris);font-size:.86rem;line-height:1.5}
.bar{height:9px;background:#f0ecff;border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--vert),var(--bleu));border-radius:99px;transition:width .5s}
.tag{display:inline-block;background:#f4f0ff;color:var(--violet);font-size:.7rem;font-weight:800;padding:3px 9px;border-radius:99px;margin-top:8px}

/* ---------- mots ---------- */
.mot{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:13px 16px;box-shadow:0 4px 14px rgba(80,40,120,.07);transition:.15s}
.mot:hover{transform:translateX(4px)}
.mot .em{font-size:1.8rem;width:42px;text-align:center}
.mot .txt{flex:1;min-width:0}
.mot .fr{font-weight:800;font-size:1.05rem}
.mot .ph{color:var(--rose);font-size:.8rem;font-weight:700}
.mot .tr{color:var(--gris);font-size:.9rem}
.rtl{direction:rtl;text-align:right;font-size:1.02rem}
.spk{border:0;background:#f3efff;color:var(--violet);width:40px;height:40px;border-radius:50%;font-size:1.1rem;cursor:pointer;transition:.15s;flex-shrink:0}
.spk:hover{background:var(--violet);color:#fff;transform:scale(1.1)}

/* ---------- flashcards ---------- */
.fc{perspective:1200px;height:280px;max-width:440px;margin:0 auto}
.fcin{position:relative;width:100%;height:100%;transition:transform .6s;transform-style:preserve-3d;cursor:pointer}
.fc.flip .fcin{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;border-radius:24px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:22px;text-align:center;box-shadow:var(--ombre)}
.fcf{background:linear-gradient(140deg,#fff,#fff2f7);border:3px solid #ffd7e6}
.fcb{background:linear-gradient(140deg,var(--violet),var(--rose));color:#fff;transform:rotateY(180deg)}
.fcf .big{font-size:3.4rem}.fcf .w{font-size:2rem;font-weight:900}
.fcb .w{font-size:1.7rem;font-weight:900}

/* ---------- quiz ---------- */
.qbox{max-width:620px;margin:0 auto}
.qq{font-size:1.5rem;font-weight:900;text-align:center;margin:6px 0 4px}
.opts{display:grid;gap:10px;margin-top:18px}
.opt{border:2px solid #ece7ff;background:#fff;border-radius:16px;padding:15px 18px;font-size:1.02rem;font-weight:700;cursor:pointer;text-align:left;font-family:inherit;transition:.15s;color:var(--sombre)}
.opt:hover:not(:disabled){border-color:var(--violet);transform:translateX(5px)}
.opt.bon{border-color:var(--vert);background:#e8fbf3;color:#0d7a54}
.opt.mauvais{border-color:#ff6b6b;background:#ffeded;color:#c02b2b}
.fb{margin-top:16px;padding:14px 16px;border-radius:16px;font-weight:800;text-align:center;animation:pop .3s}
.fb.ok{background:#e8fbf3;color:#0d7a54}.fb.no{background:#ffeded;color:#c02b2b}
@keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

/* ---------- divers jeux ---------- */
.memo{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:520px;margin:0 auto}
.mc{aspect-ratio:1;border-radius:16px;border:0;cursor:pointer;font-family:inherit;font-weight:800;font-size:.9rem;
  background:linear-gradient(135deg,var(--violet),var(--rose));color:transparent;display:grid;place-items:center;padding:6px;transition:.25s;box-shadow:0 6px 14px rgba(90,50,140,.2)}
.mc.open{background:#fff;color:var(--sombre);border:2px solid var(--violet)}
.mc.done{background:#e8fbf3;color:#0d7a54;border:2px solid var(--vert);opacity:.7;cursor:default}
.mc span{pointer-events:none}
.jetons{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;min-height:56px;padding:12px;background:#faf7ff;border-radius:16px;border:2px dashed #ddd2ff}
.jeton{border:0;background:#fff;border:2px solid var(--violet);color:var(--violet);font-weight:800;padding:9px 14px;border-radius:12px;cursor:pointer;font-family:inherit;font-size:.95rem;transition:.15s}
.jeton:hover{background:var(--violet);color:#fff}
.zone{min-height:64px;background:linear-gradient(135deg,#fff,#f7f2ff);border-radius:16px;border:2px solid #e6dcff;display:flex;flex-wrap:wrap;gap:9px;padding:12px;align-items:center;justify-content:center;margin-bottom:12px}
input.saisie{width:100%;padding:15px 18px;border-radius:16px;border:2px solid #e6dcff;font-size:1.1rem;font-family:inherit;font-weight:700;text-align:center;outline:0}
input.saisie:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(124,92,255,.14)}
.pendu{font-size:2.2rem;letter-spacing:.35rem;text-align:center;font-weight:900;margin:14px 0;word-break:break-word}
.lettres{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.lettres button{width:40px;height:40px;border-radius:12px;border:2px solid #e6dcff;background:#fff;font-weight:800;cursor:pointer;font-family:inherit;font-size:.95rem;transition:.15s}
.lettres button:hover:not(:disabled){background:var(--violet);color:#fff;border-color:var(--violet)}
.lettres button:disabled{opacity:.3;cursor:not-allowed}
.vies{font-size:1.4rem;letter-spacing:3px;text-align:center}

/* ---------- alphabet / sons ---------- */
.alpha{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.al{background:#fff;border:2px solid #f0e9ff;border-radius:16px;padding:12px 6px;text-align:center;cursor:pointer;transition:.15s}
.al:hover{border-color:var(--rose);transform:translateY(-4px);box-shadow:0 8px 18px rgba(255,92,138,.18)}
.al b{display:block;font-size:1.5rem}
.al small{color:var(--rose);font-weight:800}

/* ---------- grammaire ---------- */
.acc{background:#fff;border-radius:18px;box-shadow:0 4px 14px rgba(80,40,120,.07);overflow:hidden;margin-bottom:12px}
.acc>button{width:100%;text-align:left;border:0;background:transparent;padding:17px 20px;font-weight:800;font-size:1.02rem;cursor:pointer;font-family:inherit;display:flex;justify-content:space-between;gap:10px;align-items:center;color:var(--sombre)}
.acc .corps{display:none;padding:0 20px 20px;line-height:1.75;color:#3d3357}
.acc.open .corps{display:block;animation:pop .25s}
table{width:100%;border-collapse:collapse;margin:10px 0;font-size:.94rem}
td,th{padding:8px 10px;border-bottom:1px solid #f0ecff;text-align:left}
th{color:var(--violet);font-size:.8rem;text-transform:uppercase;letter-spacing:.5px}
.astuce{background:linear-gradient(135deg,#fff6fa,#f6f2ff);border-left:5px solid var(--rose);padding:12px 16px;border-radius:12px;margin-top:12px;font-size:.93rem}

/* ---------- badges / progrès ---------- */
.badge{background:#fff;border-radius:18px;padding:18px;text-align:center;box-shadow:0 4px 14px rgba(80,40,120,.07);opacity:.4;filter:grayscale(1);transition:.3s}
.badge.gagne{opacity:1;filter:none;box-shadow:0 8px 22px rgba(255,199,95,.35);border:2px solid var(--or)}
.badge .b{font-size:2.3rem}
.badge h4{font-size:.92rem;margin:6px 0 3px}
.badge p{font-size:.76rem;color:var(--gris)}
.stat{background:linear-gradient(135deg,#fff,#fdf7ff);border-radius:18px;padding:18px;text-align:center;box-shadow:0 4px 14px rgba(80,40,120,.07)}
.stat b{display:block;font-size:2rem;background:linear-gradient(120deg,var(--rose),var(--violet));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat span{font-size:.82rem;color:var(--gris);font-weight:700}

/* ---------- toast + confettis ---------- */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(140%);z-index:200;
  background:linear-gradient(135deg,var(--violet),var(--rose));color:#fff;padding:15px 26px;border-radius:999px;font-weight:800;
  box-shadow:0 14px 34px rgba(124,92,255,.4);transition:transform .45s cubic-bezier(.2,1.4,.4,1);max-width:90vw;text-align:center}
#toast.show{transform:translateX(-50%) translateY(0)}
.conf{position:fixed;width:11px;height:11px;z-index:150;pointer-events:none;animation:tombe linear forwards}
@keyframes tombe{to{transform:translateY(105vh) rotate(760deg);opacity:0}}

.vue{display:none;animation:fade .35s}
.vue.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.center{text-align:center}
.mt{margin-top:16px}.mt2{margin-top:28px}
.mini{font-size:.82rem;color:var(--gris)}
.subtabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.subtabs button{border:2px solid #eee6ff;background:#fff;padding:8px 15px;border-radius:999px;font-weight:800;font-size:.85rem;cursor:pointer;font-family:inherit;color:var(--gris)}
.subtabs button.on{background:var(--violet);border-color:var(--violet);color:#fff}
footer{text-align:center;padding:40px 20px;color:var(--gris);font-size:.88rem}
footer b{color:var(--rose)}
@media(max-width:640px){
  .memo{grid-template-columns:repeat(3,1fr)}
  nav.tabs{order:3;width:100%;justify-content:center}
  .hud{margin-left:auto}
}

/* ================= AJOUTS v2 : RTL + composants ================= */
html[dir="rtl"] body{font-family:"Segoe UI","Tahoma","Arial","Noto Naskh Arabic",system-ui,sans-serif}
html[dir="rtl"] nav.tabs{margin-left:0;margin-right:auto}
html[dir="rtl"] .hud{margin-left:0}
html[dir="rtl"] .opt{text-align:right}
html[dir="rtl"] .opt:hover:not(:disabled){transform:translateX(-5px)}
html[dir="rtl"] .mot:hover{transform:translateX(-4px)}
html[dir="rtl"] td,html[dir="rtl"] th{text-align:right}
html[dir="rtl"] .astuce{border-left:0;border-right:5px solid var(--rose)}
html[dir="rtl"] .acc>button{text-align:right}
html[dir="rtl"] .modcard{border-top:6px solid var(--rose)}
html[dir="rtl"] .logo small{letter-spacing:0}
html[dir="rtl"] .ltrbox{direction:ltr;text-align:left}
html[dir="rtl"] .dlg.moi{border-right:0;border-left:5px solid var(--bleu)}
html[dir="rtl"] .dlg.lui{border-right:0;border-left:5px solid #ddd6f5}
.ltrbox{direction:ltr}
.rtlbox{direction:rtl;text-align:right}

/* dialogue */
.dlg{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:0 4px 12px rgba(80,40,120,.07);display:flex;gap:12px;align-items:flex-start}
.dlg.lui{border-right:5px solid #ddd6f5}
.dlg.moi{border-right:5px solid var(--bleu);background:linear-gradient(135deg,#fff,#f2fbff)}
.dlg .who{font-size:.72rem;font-weight:800;color:var(--gris);text-transform:uppercase;letter-spacing:.5px}
.dlg .l1{font-weight:800;font-size:1.05rem;margin-top:2px}
.dlg .l2{color:var(--gris);font-size:.9rem;margin-top:3px}

/* relie les paires */
.relie{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:560px;margin:0 auto}
.relie button{border:2px solid #e6dcff;background:#fff;border-radius:14px;padding:12px 8px;font-family:inherit;font-weight:800;cursor:pointer;font-size:.95rem;transition:.15s;color:var(--sombre)}
.relie button:hover:not(:disabled){border-color:var(--violet)}
.relie button.sel{background:var(--violet);color:#fff;border-color:var(--violet)}
.relie button.ok{background:#e8fbf3;color:#0d7a54;border-color:var(--vert);cursor:default;opacity:.65}
.relie button.no{background:#ffeded;border-color:#ff6b6b}

/* chrono */
.chrono{font-size:2.2rem;font-weight:900;text-align:center;color:var(--rose)}
.progtxt{display:flex;justify-content:space-between;font-size:.82rem;font-weight:800;color:var(--gris);margin-bottom:6px}
.son{background:#fff;border-radius:16px;padding:14px 16px;box-shadow:0 4px 12px rgba(80,40,120,.07);display:flex;gap:12px;align-items:center}
.son .s{font-size:1.35rem;font-weight:900;color:var(--violet);min-width:74px}
.jeucard{cursor:pointer;text-align:center;transition:.2s}
.jeucard:hover{transform:translateY(-6px)}
.jeucard .ico{font-size:2.6rem}
.jeucard h3{margin:8px 0 4px;font-size:1.08rem}
.jeucard p{color:var(--gris);font-size:.85rem;line-height:1.5}
.lettreamour{background:linear-gradient(135deg,#fff6fa,#f6f2ff);border:2px dashed var(--rose);border-radius:22px;padding:24px;line-height:1.9;font-size:1rem}

</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="coeurs" id="coeurs"></div>

<header class="top">
  <div class="topin">
    <div class="logo">
      <div class="bulle">&#127467;&#127479;</div>
      <div><span id="marque">Fran&ccedil;ais Facile</span><small id="dedi">pour mon amour Halima &#10084;&#65039;</small></div>
    </div>
    <nav class="tabs" id="nav"></nav>
    <div class="hud">
      <div class="chip xp">&#11088; <span id="hudXp">0</span></div>
      <div class="chip streak">&#128293; <span id="hudStreak">0</span></div>
      <div class="langsel" id="langsel">
        <button data-l="fr" class="on">FR</button>
        <button data-l="ar">&#1593;&#1585;&#1576;&#1610;</button>
      </div>
    </div>
  </div>
</header>

<div class="wrap">
  <section id="v-accueil" class="vue on"></section>
  <section id="v-lecons" class="vue"></section>
  <section id="v-module" class="vue"></section>
  <section id="v-alphabet" class="vue"></section>
  <section id="v-jeux" class="vue"></section>
  <section id="v-grammaire" class="vue"></section>
  <section id="v-progres" class="vue"></section>
</div>

<footer>
  <span id="footTxt">Fait avec &#10084;&#65039;, patience et beaucoup de tendresse pour <b>mon amour Halima</b>.</span><br>
  <span class="mini" id="footTxt2">Chaque mot appris te rapproche un peu plus de moi. Bon courage, ma vie ! &#128144;</span>
</footer>

<div id="toast"></div>

<script>
/* ============================================================
   DONNÉES 1/2 — Modules de vocabulaire (français ⇄ arabe)
   Chaque mot : fr = français, ph = prononciation en lettres latines,
                pa = prononciation en lettres arabes, ar = traduction, em = emoji
   ============================================================ */
const MODULES_A = [
{
  id:"salutations", ico:"👋", niv:1,
  t:{fr:"Dire bonjour", ar:"نسلّم على الناس"},
  d:{fr:"Les tout premiers mots : saluer, remercier, être poli.", ar:"لكلمات لولى: تسلّم، تشكر، وتكون مؤدبة."},
  mots:[
    {fr:"Bonjour", ph:"bon-jour", pa:"بونجور", ar:"صباح الخير / السلام عليكم", em:"☀️"},
    {fr:"Bonsoir", ph:"bon-soir", pa:"بونسوار", ar:"مسا الخير", em:"🌆"},
    {fr:"Bonne nuit", ph:"bon nui", pa:"بون نوي", ar:"تصبح على خير", em:"🌙"},
    {fr:"Salut", ph:"sa-lu", pa:"سالو", ar:"سلام (بين الصحاب)", em:"🙋"},
    {fr:"Au revoir", ph:"o re-vwar", pa:"أو روفوار", ar:"بسلامة", em:"👋"},

/* ---------- Progression ---------- */
const CLE = "halima_fr_v1";

try { const s = localStorage.getItem(CLE); if (s) P = Object.assign({}, vide, JSON.parse(s)); } catch(e){}

const TOTAL_MOTS = MODULES.reduce((a,m)=>a+m.mots.length,0);
const $ = s => document.querySelector(s);
const $$ = s => Array.prototype.slice.call(document.querySelectorAll(s));
function esc(x){ return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

/* ---------- Utilitaires ---------- */
function melange(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const x=a[i]; a[i]=a[j]; a[j]=x; } return a; }
function auHasard(a){ return a[Math.floor(Math.random()*a.length)]; }
function motDoux(){ return auHasard(MOTS_DOUX[LANG]); }
function aujourdhui(){ return new Date().toISOString().slice(0,10); }

let toastTimer = null;
function toast(msg){
  const el = $("#toast");
  el.innerHTML = msg;
  el.style.direction = t().dir;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 2900);
}

function confettis(n){
  n = n || 40;
  const cols = ["#ff5c8a","#7c5cff","#3ecfff","#22c98a","#ffc75f","#ff8fb1"];
  for(let i=0;i<n;i++){
    const d = document.createElement("div");
    d.className = "conf";
    d.style.left = Math.random()*100+"vw";
    d.style.top = "-20px";
    d.style.background = auHasard(cols);
    d.style.borderRadius = Math.random()>.5 ? "50%" : "3px";
    d.style.animationDuration = (1.6+Math.random()*1.6)+"s";
    d.style.animationDelay = (Math.random()*.35)+"s";
    document.body.appendChild(d);
    setTimeout(()=>d.remove(), 3600);
  }
}

/* ---------- Voix (TTS) ---------- */
let VOIX = null;
function chargeVoix(){
  if(!("speechSynthesis" in window)) return;
  const v = speechSynthesis.getVoices().filter(x=>/^fr/i.test(x.lang));
  VOIX = v.find(x=>/(Amelie|Amélie|Audrey|Julie|Virginie|Hortense|female|femme)/i.test(x.name)) || v[0] || null;
}
if("speechSynthesis" in window){ chargeVoix(); speechSynthesis.onvoiceschanged = chargeVoix; }

function dis(txt, vitesse){
  if(!("speechSynthesis" in window)) { toast(estAr()? "🔇 الصوت غير متاح على هذا الجهاز" : "🔇 La voix n'est pas disponible ici"); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(String(txt));
  u.lang = "fr-FR";
  u.rate = vitesse || .85;
  u.pitch = 1.05;
  if(VOIX) u.voice = VOIX;
  speechSynthesis.speak(u);
  return u;
}
function stopVoix(){ if("speechSynthesis" in window) speechSynthesis.cancel(); }

/* Lit une liste de textes l'un après l'autre */
function disSuite(liste, i, fin){
  i = i || 0;
  if(i >= liste.length){ if(fin) fin(); return; }
  const u = dis(liste[i]);
  if(!u){ if(fin) fin(); return; }
  u.onend = ()=> setTimeout(()=>disSuite(liste, i+1, fin), 380);
}

/* ---------- XP / badges / streak ---------- */
function ajouteXP(n){
  P.xp += n; sauve(); majHUD();
  if(P.xp>=50) gagneBadge("xp50");
  if(P.xp>=200) gagneBadge("xp200");
  if(P.xp>=500) gagneBadge("xp500");
  if(P.xp>=1000) gagneBadge("xp1000");
}
function gagneBadge(id){
  if(P.badges.indexOf(id)>=0) return;
  const b = BADGES.find(x=>x.id===id); if(!b) return;
  P.badges.push(id); sauve();
  toast(t().nouveauBadge+" "+b.ico+" "+b.t[LANG]);
  confettis(55);
}
function majStreak(){
  const h = aujourdhui();
  if(P.dernierJour === h) return;
  const hier = new Date(Date.now()-86400000).toISOString().slice(0,10);
  P.streak = (P.dernierJour === hier) ? P.streak+1 : 1;
  P.dernierJour = h;
  if(P.jours.indexOf(h)<0) P.jours.push(h);
  if(P.streak>=3) gagneBadge("streak3");
  if(P.streak>=7) gagneBadge("streak7");
  sauve(); majHUD();
}
function majHUD(){
  $("#hudXp").textContent = P.xp;
  $("#hudStreak").textContent = P.streak;
}
function marqueVu(modId, motFr){
  if(!P.vus[modId]) P.vus[modId] = [];
  if(P.vus[modId].indexOf(motFr)<0){ P.vus[modId].push(motFr); sauve(); }
}
function progresModule(m){
  const v = P.vus[m.id] ? P.vus[m.id].length : 0;
  return Math.min(100, Math.round(v/m.mots.length*100));
}
function motsVus(){ let n=0; for(const k in P.vus) n += P.vus[k].length; return n; }
function modulesFinis(){ return MODULES.filter(m=>progresModule(m)>=100).length; }
function verifieBadgesModules(){
  const f = modulesFinis();
  if(f>=3) gagneBadge("mod3");
  if(f>=8) gagneBadge("mod8");
  if(f>=MODULES.length) gagneBadge("tout");
}

    .map(k=>`<button data-v="${k}" class="${VUE===k?'on':''}">${n[k]}</button>`).join("");
  $$("#nav button").forEach(b=> b.onclick = ()=> nav(b.dataset.v));
}

function nav(id, ctx){
  stopVoix();
  arreteChrono();
  VUE = id; CTX = ctx || null;
  VUES.forEach(v=> $("#v-"+v).classList.toggle("on", v===id));

  const f = {accueil:rAccueil, lecons:rLecons, module:rModule, alphabet:rAlphabet, jeux:rJeux, grammaire:rGrammaire, progres:rProgres}[id];
  if(f) f(ctx);
  window.scrollTo({top:0, behavior:"smooth"});
}

  const d = t().dir;

let fcOrdre = [], fcI = 0, fcFlip = false;
function sCartes(m){
  const L = t();
  fcOrdre = m.mots.map((_,i)=>i); fcI = 0; fcFlip = false;
  $("#mBody").innerHTML = `
    <div class="center mini" id="fcNum"></div>
    <div class="fc mt" id="fc"><div class="fcin">
      <div class="fcf"><div class="big" id="fcEm"></div><div class="w ltrbox" id="fcFr"></div><div style="color:var(--rose);font-weight:800" class="ltrbox" id="fcPh"></div><div class="mini">${L.clicRetourner}</div></div>
      <div class="fcb"><div class="big" id="fcEm2" style="font-size:2.4rem"></div><div class="w rtlbox" id="fcAr"></div><div style="opacity:.85" id="fcPa"></div></div>
    </div></div>

      <button class="btn ghost sm" id="fcPrec">${L.prec}</button>
      <button class="spk" id="fcSpk">🔊</button>
      <button class="btn vert sm" id="fcOk">${L.connais}</button>
      <button class="btn sm" id="fcNext">${L.suivant}</button>
    </div>
    <div class="center mt"><button class="btn ghost sm" id="fcMel">${L.melanger}</button></div>`;

  function montre(){
    const w = m.mots[fcOrdre[fcI]];
    fcFlip = false; $("#fc").classList.remove("flip");
    $("#fcNum").textContent = `${t().carte} ${fcI+1} / ${fcOrdre.length}`;
    $("#fcEm").textContent = w.em||"🌸"; $("#fcEm2").textContent = w.em||"🌸";
    $("#fcFr").textContent = w.fr; $("#fcPh").textContent = w.ph;
    $("#fcAr").textContent = w.ar; $("#fcPa").textContent = w.pa;
  }
  $("#fc").onclick = ()=>{
    fcFlip = !fcFlip;
    $("#fc").classList.toggle("flip", fcFlip);
    if(fcFlip){ const w=m.mots[fcOrdre[fcI]]; dis(w.fr); marqueVu(m.id,w.fr); majStreak(); }
  };
  $("#fcSpk").onclick = e=>{ e.stopPropagation(); dis(m.mots[fcOrdre[fcI]].fr); };
  $("#fcNext").onclick = ()=>{ fcI = (fcI+1)%fcOrdre.length; montre(); };
  $("#fcPrec").onclick = ()=>{ fcI = (fcI-1+fcOrdre.length)%fcOrdre.length; montre(); };
  $("#fcMel").onclick = ()=>{ fcOrdre = melange(fcOrdre); fcI=0; montre(); toast("🔀"); };
  $("#fcOk").onclick = ()=>{
    const w = m.mots[fcOrdre[fcI]];
    marqueVu(m.id, w.fr); ajouteXP(3); majStreak(); verifieBadgesModules();
    if(fcI === fcOrdre.length-1){ confettis(50); toast(motDoux()); }
    fcI = (fcI+1)%fcOrdre.length; montre();
  };
  montre();
}

/* ----- Sous-vue : quiz ----- */
let qList = [], qI = 0, qScore = 0;
function sQuiz(m){
  const L = t();
  qList = melange(m.mots).slice(0, Math.min(10, m.mots.length));
  qI = 0; qScore = 0;
  poseQ(m);
}
function poseQ(m){
  const L = t();
  if(qI >= qList.length) return finQuiz(m);
  const w = qList[qI];
  const versFr = Math.random() > .45;
  const autres = melange(MODULES.reduce((a,x)=>a.concat(x.mots),[]).filter(x=>x.fr!==w.fr)).slice(0,3);
  const opts = melange([w].concat(autres));
  $("#mBody").innerHTML = `
    <div class="qbox">
      <div class="row" style="justify-content:space-between">
        <span class="mini" style="font-weight:800">${L.question} ${qI+1}/${qList.length}</span>
        <span class="mini" style="font-weight:800">${L.score} : ${qScore} ⭐</span>
      </div>
      <div class="bar mt"><i style="width:${qI/qList.length*100}%"></i></div>
      <div class="card mt" style="text-align:center">
        <div class="mini" style="font-weight:800">${versFr ? L.commentDit : L.queVeutDire}</div>
        <div style="font-size:2.4rem;margin:6px 0">${w.em||"❓"}</div>
        <div class="qq ${versFr?'rtlbox':'ltrbox'}">${esc(versFr ? w.ar : w.fr)}</div>
        ${versFr ? "" : `<button class="spk" id="qSpk" style="margin-top:8px">🔊</button>`}
      </div>
      <div class="opts" id="qOpts">
        ${opts.map((o,i)=>`<button class="opt ${versFr?'ltrbox':'rtlbox'}" data-i="${i}">${esc(versFr ? o.fr : o.ar)}</button>`).join("")}
      </div>
      <div id="qFb"></div>
    </div>`;
  if(!versFr) $("#qSpk").onclick = ()=> dis(w.fr);
  else dis(w.fr, .9);

  $$("#qOpts .opt").forEach(b=> b.onclick = ()=>{
    const choix = opts[+b.dataset.i];
    const bon = choix.fr === w.fr;
    $$("#qOpts .opt").forEach((x,i)=>{
      x.disabled = true;
      if(opts[i].fr === w.fr) x.classList.add("bon");
      else if(x===b) x.classList.add("mauvais");
    });
    P.quizTotal++;
    if(bon){
      P.quizOk++; qScore++; ajouteXP(5); marqueVu(m.id, w.fr);
      $("#qFb").innerHTML = `<div class="fb ok">✅ ${esc(motDoux())}</div>`;
      dis(w.fr);
    } else {
      $("#qFb").innerHTML = `<div class="fb no">${t().bonneRep} <b class="ltrbox">${esc(w.fr)}</b> — ${esc(w.ar)}</div>`;
      dis(w.fr, .75);
    }
    sauve(); majStreak();
    if(P.quizOk>=10) gagneBadge("quiz10");
    if(P.quizOk>=50) gagneBadge("quiz50");
    if(P.quizOk>=200) gagneBadge("quiz200");
    const nx = document.createElement("button");
    nx.className = "btn mt"; nx.style.width = "100%";
    nx.textContent = t().suivant;
    nx.onclick = ()=>{ qI++; poseQ(m); };
    $("#qFb").appendChild(nx);
  });
}
function finQuiz(m){
  const L = t();
  const pc = Math.round(qScore/qList.length*100);
  if(pc>=80) confettis(70);
  verifieBadgesModules();
  $("#mBody").innerHTML = `<div class="card center">
    <div style="font-size:3.4rem">${pc>=80?"🏆":pc>=50?"👏":"💪"}</div>
    <h3 style="font-size:1.5rem;margin:8px 0">${qScore} / ${qList.length} ${L.bonnesRep}</h3>
    <p class="mini">${esc(motDoux())}</p>
    <div class="row mt2" style="justify-content:center">
      <button class="btn" id="qRe">${L.rejouer}</button>
      <button class="btn ghost" id="qMots">${L.revoirMots}</button>
    </div></div>`;
  $("#qRe").onclick = ()=> sQuiz(m);
  $("#qMots").onclick = ()=> nav("module",{id:m.id,sub:"mots"});
}

/* ----- Sous-vue : dictée / écrire ----- */
let dOrdre = [], dI = 0, dOk = 0;
function sEcrire(m){
  dOrdre = melange(m.mots).slice(0, Math.min(10, m.mots.length));
  dI = 0; dOk = 0;
  poseDictee(m);
}
function poseDictee(m){
  const L = t();
  if(dI >= dOrdre.length){
    confettis(50);
    $("#mBody").innerHTML = `<div class="card center">
      <div style="font-size:3.2rem">✍️</div>
      <h3 style="font-size:1.4rem;margin:8px 0">${dOk} / ${dOrdre.length} ${L.motsBienEcrits}</h3>
      <p class="mini">${esc(motDoux())}</p>
      <button class="btn mt2" id="dRe">${L.recommencer}</button></div>`;
    $("#dRe").onclick = ()=> sEcrire(m);
    return;
  }
  const w = dOrdre[dI];
  $("#mBody").innerHTML = `
    <div class="qbox card">
      <div class="row" style="justify-content:space-between">
        <span class="mini" style="font-weight:800">${L.dictee} ${dI+1}/${dOrdre.length}</span>
        <span class="mini" style="font-weight:800">${dOk} ✅</span>
      </div>
      <p class="center mt" style="font-weight:800">${L.ecouteEcris}</p>
      <div class="center" style="font-size:3rem">${w.em||"🔊"}</div>
      <div class="row" style="justify-content:center">
        <button class="btn sm" id="eSpk">${L.reecouter}</button>
        <button class="btn ghost sm" id="eLent">${L.plusLent}</button>
        <button class="btn ghost sm" id="eInd">💡 ${L.indice}</button>
      </div>
      <div class="center mini mt rtlbox" id="eIndice"></div>
      <input class="saisie mt ltrbox" id="eIn" placeholder="${L.ecrisIci}" autocomplete="off" spellcheck="false">
      <div class="center mt"><button class="btn" id="eVer">${L.verifier}</button></div>
      <div id="eFb"></div>
    </div>`;
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z' ]/g,"").replace(/\s+/g," ").trim();
  dis(w.fr, .8);
  $("#eSpk").onclick = ()=> dis(w.fr, .8);
  $("#eLent").onclick = ()=> dis(w.fr, .5);
  $("#eInd").onclick = ()=> { $("#eIndice").textContent = w.ar + "  ·  " + w.ph; };
  const valide = ()=>{
    const v = $("#eIn").value;
    if(!v.trim()) return;
    const bon = norm(v) === norm(w.fr);
    if(bon){ dOk++; ajouteXP(6); marqueVu(m.id,w.fr); $("#eFb").innerHTML = `<div class="fb ok">${L.parfait} <b class="ltrbox">${esc(w.fr)}</b></div>`; }
    else $("#eFb").innerHTML = `<div class="fb no">${L.onEcrit} <b class="ltrbox">${esc(w.fr)}</b></div>`;
    dis(w.fr);
    majStreak();
    $("#eIn").disabled = true; $("#eVer").disabled = true;
    setTimeout(()=>{ dI++; poseDictee(m); }, bon?1100:2100);
  };
  $("#eVer").onclick = valide;
  $("#eIn").onkeydown = e=>{ if(e.key==="Enter") valide(); };
  setTimeout(()=>{ const i=$("#eIn"); if(i) i.focus(); }, 100);
}

function tousLesMots(){ return MODULES.reduce((a,m)=>a.concat(m.mots),[]); }
/* Sélecteurs limités à la zone de jeu : évite de capturer des éléments
   d'autres vues qui portent les mêmes attributs (grammaire, dialogue…). */
function $j(sel){ const z = $("#jZone"); return z ? z.querySelector(sel) : null; }
function $$j(sel){ const z = $("#jZone"); return z ? Array.prototype.slice.call(z.querySelectorAll(sel)) : []; }
function cadreJeu(titre, corps){
  return `<div class="card"><div class="row" style="justify-content:space-between;margin-bottom:12px">
      <h3 style="font-size:1.2rem">${titre}</h3>
      <button class="btn ghost sm" id="jFermer">✖ ${t().fermer}</button>
    </div>${corps}</div>`;
}
function brancheFermer(){ const b=$("#jFermer"); if(b) b.onclick = ()=>{ arreteChrono(); stopVoix(); $("#jZone").innerHTML=""; }; }

/* ----- Jeu 1 : mémoire ----- */
function jMemoire(){
  const L = t();
  const sel = melange(tousLesMots()).slice(0,8);
  let cartes = melange(sel.map(w=>({k:w.fr, txt:w.fr, ltr:true, w:w})).concat(sel.map(w=>({k:w.fr, txt:w.ar, ltr:false, w:w}))));
  let ouvert = [], trouve = 0, coups = 0, bloque = false;
  $("#jZone").innerHTML = cadreJeu("🧠 "+L.jMemo, `
    <p class="mini center">${L.trouvePaires}</p>
    <div class="row center mt" style="justify-content:center"><span class="chip">${L.coups} : <b id="mmC">0</b></span></div>
    <div class="memo mt" id="mmG">${cartes.map((c,i)=>`<button class="mc" data-i="${i}"><span class="${c.ltr?'ltrbox':'rtlbox'}">${esc(c.txt)}</span></button>`).join("")}</div>
    <div class="center mt2"><button class="btn ghost sm" id="mmNew">${L.nouvellePartie}</button></div>`);
  brancheFermer();
  $j("#mmNew").onclick = jMemoire;
  $$j("#mmG .mc").forEach(b=> b.onclick = ()=>{
    if(bloque || b.classList.contains("open") || b.classList.contains("done")) return;
    const c = cartes[+b.dataset.i];
    b.classList.add("open");
    if(c.ltr) dis(c.w.fr);
    ouvert.push({b:b, c:c});
    if(ouvert.length===2){
      coups++; $j("#mmC").textContent = coups; bloque = true;
      const [a,d] = ouvert;
      if(a.c.k === d.c.k && a.b !== d.b){
        setTimeout(()=>{
          a.b.classList.add("done"); d.b.classList.add("done");
          a.b.classList.remove("open"); d.b.classList.remove("open");
          ouvert=[]; bloque=false; trouve++; ajouteXP(4); majStreak();
          if(trouve===8){ gagneBadge("memo"); confettis(70); toast(motDoux()); }
        }, 480);
      } else {
        setTimeout(()=>{ a.b.classList.remove("open"); d.b.classList.remove("open"); ouvert=[]; bloque=false; }, 850);
      }
    }
  });
}

/* ----- Jeu 2 : relie les paires ----- */
function jPaires(){
  const L = t();
  const sel = melange(tousLesMots()).slice(0,6);
  const gauche = melange(sel), droite = melange(sel);
  let selG = null, faits = 0;
  $("#jZone").innerHTML = cadreJeu("🔗 "+L.jPaires, `
    <p class="mini center">${L.relie}</p>
    <div class="relie mt">
      <div style="display:grid;gap:10px">${gauche.map((w,i)=>`<button class="ltrbox" data-g="${i}">${esc(w.fr)}</button>`).join("")}</div>
      <div style="display:grid;gap:10px">${droite.map((w,i)=>`<button class="rtlbox" data-d="${i}">${esc(w.ar)}</button>`).join("")}</div>
    </div>
    <div class="center mt2"><button class="btn ghost sm" id="rlNew">${L.nouvellePartie}</button></div>`);
  brancheFermer();
  $("#rlNew").onclick = jPaires;
  $$j("[data-g]").forEach(b=> b.onclick = ()=>{
    if(b.classList.contains("ok")) return;
    $$j("[data-g]").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel"); selG = gauche[+b.dataset.g];
    dis(selG.fr);
  });
  $$j("[data-d]").forEach(b=> b.onclick = ()=>{
    if(b.classList.contains("ok") || !selG) return;
    const w = droite[+b.dataset.d];
    const bg = $$j("[data-g]").find(x=>x.classList.contains("sel"));
    if(w.fr === selG.fr){
      b.classList.add("ok"); if(bg){ bg.classList.remove("sel"); bg.classList.add("ok"); }
      selG = null; faits++; ajouteXP(4); majStreak();
      if(faits === sel.length){ confettis(60); toast(L.bravoRelie+" "+motDoux()); }
    } else {
      b.classList.add("no");
      setTimeout(()=>b.classList.remove("no"), 500);
    }
  });
}

/* ----- Jeu 3 : construis la phrase ----- */
let phFaites = 0;
function jPhrase(){
  const L = t();
  const p = auHasard(PHRASES_JEU);
  const mots = p.fr.split(" ");
  let placés = [];
  $("#jZone").innerHTML = cadreJeu("🧩 "+L.jPhrase, `
    <p class="mini center">${L.traduisEnFr}</p>
    <p class="center rtlbox" style="font-size:1.25rem;font-weight:900;margin:8px 0">${esc(p.ar)}</p>
    <div class="zone ltrbox" id="phZone"><span class="mini">${L.cliqueMots}</span></div>
    <div class="jetons" id="phJetons">${melange(mots).map((w,i)=>`<button class="jeton ltrbox" data-w="${esc(w)}">${esc(w)}</button>`).join("")}</div>
    <div class="row mt2" style="justify-content:center">
      <button class="btn" id="phVer">${L.verifPhrase}</button>
      <button class="btn ghost sm" id="phAudio">${L.indiceAudio}</button>
      <button class="btn ghost sm" id="phNew">${L.autrePhrase}</button>
    </div>
    <div id="phFb"></div>`);
  brancheFermer();
  function maj(){
    $j("#phZone").innerHTML = placés.length
      ? placés.map((w,i)=>`<button class="jeton" data-r="${i}">${esc(w)}</button>`).join("")
      : `<span class="mini">${L.cliqueMots}</span>`;
    $$j("#phZone [data-r]").forEach(b=> b.onclick = ()=>{
      const i = +b.dataset.r, w = placés[i];
      placés.splice(i,1);
      const j = document.createElement("button");
      j.className = "jeton ltrbox"; j.dataset.w = w; j.textContent = w;
      j.onclick = ()=>{ placés.push(w); j.remove(); maj(); };
      $j("#phJetons").appendChild(j);
      maj();
    });
  }
  $$j("#phJetons .jeton").forEach(b=> b.onclick = ()=>{ placés.push(b.dataset.w); b.remove(); maj(); });
  $j("#phAudio").onclick = ()=> dis(p.fr, .7);
  $j("#phNew").onclick = jPhrase;
  $j("#phVer").onclick = ()=>{
    const rep = placés.join(" ");
    if(rep === p.fr){
      phFaites++; ajouteXP(12); majStreak(); confettis(55);
      $j("#phFb").innerHTML = `<div class="fb ok">✅ ${esc(motDoux())}</div>`;
      dis(p.fr);
      if(phFaites>=5) gagneBadge("phrase");
      setTimeout(jPhrase, 2200);
    } else {
      $j("#phFb").innerHTML = `<div class="fb no">${L.presque} <b class="ltrbox">${esc(p.fr)}</b></div>`;
      dis(p.fr, .7);
    }
  };
  maj();
}

/* ----- Jeu 4 : le mot caché (pendu) ----- */
function jPendu(){
  const L = t();
  const w = auHasard(tousLesMots().filter(x=>/^[A-Za-zÀ-ÿ' ]{4,12}$/.test(x.fr)));
  const cible = w.fr.toUpperCase();
  const lettres = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
  let trouvees = [], vies = 6, fini = false;
  $("#jZone").innerHTML = cadreJeu("🎪 "+L.jPendu, `
    <p class="center mini">${L.penduIndice} : <b class="rtlbox">${esc(w.ar)}</b> ${w.em||""}</p>
    <div class="vies center" id="pdV"></div>
    <div class="pendu ltrbox" id="pdM"></div>
    <div class="lettres" id="pdL">${lettres.map(l=>`<button data-l="${l}">${l}</button>`).join("")}</div>
    <div class="center mt2">
      <button class="btn ghost sm" id="pdSpk">${L.ecouter}</button>
      <button class="btn ghost sm" id="pdNew">${L.nouveauMot}</button>
    </div>
    <div id="pdFb"></div>`);
  brancheFermer();
  $j("#pdNew").onclick = jPendu;
  $j("#pdSpk").onclick = ()=> dis(w.fr);
  function affiche(){
    $j("#pdV").textContent = "❤️".repeat(vies) + "🖤".repeat(6-vies);
    $j("#pdM").textContent = cible.split("").map(c=>{
      if(!/[A-ZÀ-Ý]/.test(c)) return c === " " ? " · " : c;
      return trouvees.indexOf(c)>=0 ? c : "_";
    }).join(" ");
  }
  function gagne(){ return cible.split("").every(c=> !/[A-ZÀ-Ý]/.test(c) || trouvees.indexOf(c)>=0); }
  $$j("#pdL button").forEach(b=> b.onclick = ()=>{
    if(fini) return;
    const l = b.dataset.l; b.disabled = true;
    if(cible.indexOf(l)>=0){ trouvees.push(l); }
    else { vies--; }
    affiche();
    if(gagne()){
      fini = true; ajouteXP(15); majStreak(); gagneBadge("pendu"); confettis(65);
      $j("#pdFb").innerHTML = `<div class="fb ok">${L.bravoMot} <b class="ltrbox">${esc(w.fr)}</b> — ${esc(w.ar)}</div>`;
      dis(w.fr);
      $$j("#pdL button").forEach(x=>x.disabled=true);
    } else if(vies<=0){
      fini = true;
      $j("#pdFb").innerHTML = `<div class="fb no">${L.motEtait} : <b class="ltrbox">${esc(w.fr)}</b> — ${esc(w.ar)}</div>`;
      dis(w.fr, .7);
      $$j("#pdL button").forEach(x=>x.disabled=true);
      trouvees = cible.split(""); affiche();
    }
  });
  affiche();
}

/* ----- Jeu 5 : fine oreille ----- */
let orOk = 0;
function jOreille(){
  const L = t();
  const cible = auHasard(tousLesMots());
  const opts = melange([cible].concat(melange(tousLesMots().filter(x=>x.fr!==cible.fr)).slice(0,3)));
  $("#jZone").innerHTML = cadreJeu("👂 "+L.jOreille, `
    <p class="mini center">${L.oreilleP}</p>
    <div class="center mt"><button class="spk" id="orSpk" style="width:76px;height:76px;font-size:2rem">🔊</button></div>
    <div class="row mt" style="justify-content:center">
      <button class="btn ghost sm" id="orLent">${L.plusLent}</button>
    </div>
    <div class="opts mt" id="orOpts">${opts.map((o,i)=>`<button class="opt ltrbox" data-i="${i}">${esc(o.fr)}</button>`).join("")}</div>
    <div id="orFb"></div>
    <div class="center mt2"><button class="btn ghost sm" id="orNew">${L.motSuivant}</button></div>`);
  brancheFermer();
  $j("#orSpk").onclick = ()=> dis(cible.fr, .85);
  $j("#orLent").onclick = ()=> dis(cible.fr, .5);
  $j("#orNew").onclick = jOreille;
  setTimeout(()=>dis(cible.fr, .85), 250);
  $$j("#orOpts .opt").forEach(b=> b.onclick = ()=>{
    const o = opts[+b.dataset.i];
    $$j("#orOpts .opt").forEach((x,i)=>{ x.disabled=true; if(opts[i].fr===cible.fr) x.classList.add("bon"); else if(x===b) x.classList.add("mauvais"); });
    if(o.fr === cible.fr){
      orOk++; ajouteXP(5); majStreak();
      $j("#orFb").innerHTML = `<div class="fb ok">✅ ${esc(cible.fr)} — ${esc(cible.ar)}</div>`;
      if(orOk>=10){ gagneBadge("oreille"); }
      confettis(25);
    } else {
      $j("#orFb").innerHTML = `<div class="fb no">${L.bonneRep} <b class="ltrbox">${esc(cible.fr)}</b> — ${esc(cible.ar)}</div>`;
    }
    dis(cible.fr, .7);
    setTimeout(jOreille, 1900);
  });
}

/* ----- Jeu 6 : défi 60 secondes ----- */
let chrono = null;
function arreteChrono(){ if(chrono){ clearInterval(chrono); chrono = null; } }
function jRapide(){
  const L = t();
  let temps = 60, score = 0, fini = false;
  $("#jZone").innerHTML = cadreJeu("⚡ "+L.jRapide, `
    <p class="mini center">${L.defiP}</p>
    <div class="chrono mt" id="rpT">60</div>
    <div class="center mini" style="font-weight:800">${L.score} : <span id="rpS">0</span></div>
    <div id="rpQ" class="mt"></div>`);
  brancheFermer();
  arreteChrono();
  chrono = setInterval(()=>{
    temps--;
    const el = $j("#rpT"); if(!el){ arreteChrono(); return; }
    el.textContent = Math.max(0,temps);
    if(temps<=0){ arreteChrono(); finRapide(); }
  }, 1000);

  function question(){
    if(fini) return;
    const w = auHasard(tousLesMots());
    const opts = melange([w].concat(melange(tousLesMots().filter(x=>x.fr!==w.fr)).slice(0,3)));
    const q = $j("#rpQ"); if(!q) return;
    q.innerHTML = `
      <div class="center rtlbox" style="font-size:1.5rem;font-weight:900;margin:6px 0">${esc(w.em||"")} ${esc(w.ar)}</div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt ltrbox" data-i="${i}">${esc(o.fr)}</button>`).join("")}</div>`;
    $$j("#rpQ .opt").forEach(b=> b.onclick = ()=>{
      if(opts[+b.dataset.i].fr === w.fr){
        score++; $j("#rpS").textContent = score;
        b.classList.add("bon"); ajouteXP(2);
        P.quizOk++; P.quizTotal++; sauve();
      } else {
        b.classList.add("mauvais");
        temps = Math.max(0, temps-3);
        $j("#rpT").textContent = temps;
        P.quizTotal++; sauve();
      }
      setTimeout(question, 220);
    });
  }
  function finRapide(){
    fini = true;
    majStreak();
    if(score>=10) confettis(70);
    if(P.quizOk>=10) gagneBadge("quiz10");
    if(P.quizOk>=50) gagneBadge("quiz50");
    const q = $j("#rpQ"); if(!q) return;
    q.innerHTML = `<div class="center">
      <div style="font-size:3rem">${score>=15?"🏆":score>=8?"👏":"💪"}</div>
      <h3 style="font-size:1.4rem;margin:8px 0">${score} ${L.finDefi}</h3>
      <p class="mini">${esc(motDoux())}</p>
      <button class="btn mt2" id="rpRe">${L.rejouer}</button></div>`;
    $j("#rpRe").onclick = jRapide;
  }
  question();
}
